name: Build & Deploy Swagger UI

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SPRING_ID: ${{ secrets.SPRING_ID }}
      SPRING_SECRET: ${{ secrets.SPRING_SECRET }}
      CLOUDINARY_KEY: ${{ secrets.CLOUDINARY_KEY }}
      CLOUDINARY_SECRET: ${{ secrets.CLOUDINARY_SECRET }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      API_KEY: ${{ secrets.API_KEY }}
      EMAIL: ${{ secrets.EMAIL }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build the app
        run: ./mvnw clean package -DskipTests

      - name: Run the app temporarily
        run: |
          nohup java -jar target/*.jar &
          sleep 10
          curl http://localhost:8080/v3/api-docs -o swagger-ui/openapi.json
          pkill -f "java"

      - name: Download Swagger UI static files
        run: |
          mkdir -p swagger-ui
          curl -L https://github.com/swagger-api/swagger-ui/archive/refs/heads/master.zip -o swagger.zip
          unzip swagger.zip
          cp -r swagger-ui-master/dist/* swagger-ui/
          rm -rf swagger.zip swagger-ui-master

      - name: Configure index.html
        run: |
          sed -i 's#https://petstore.swagger.io/v2/swagger.json#openapi.json#g' swagger-ui/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./swagger-ui
